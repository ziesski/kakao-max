name: publish

# Publish the npm package from a version tag on main with npm trusted publishing (OIDC): no npm token is
# stored in the repository. A manual run only packs and checks (`npm publish --dry-run`); it never publishes.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    # The `npm` environment is where the person adds a required reviewer, so no tag publishes without approval.
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json and is on main
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$version" ]; then
            echo "Tag $TAG does not match package.json version $version" >&2
            exit 1
          fi
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag $TAG is not on main" >&2
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run check:publication
      - run: npm run check:package
      # Trusted publishing needs npm 11.5.1 or later; Node 22 ships npm 10.
      - run: npm install --global npm@11.21.0
      - name: Publish
        if: github.ref_type == 'tag'
        run: npm publish --access public
      # npm refuses even a dry run of a version it already has, so a manual run between releases checks a
      # throwaway prerelease version. The change stays in the runner and is never committed or published.
      - name: Dry run
        if: github.ref_type != 'tag'
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          npm version --no-git-tag-version "$(node -p "require('./package.json').version")-dryrun.$RUN_ID"
          npm publish --access public --tag dryrun --dry-run
